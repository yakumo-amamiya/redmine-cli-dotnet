name: CI

# Builds and tests, publishes the Native AOT exe and runs the same tests against it, and tries install.ps1 on
# Windows PowerShell 5.1 (the shell most users run `irm ... | iex` in) and on PowerShell 7.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      - run: dotnet test --no-build -c Release --logger "console;verbosity=normal"
      - name: publish (Native AOT)
        run: dotnet publish src/RedmineCli -c Release -r win-x64 -o out/win-x64
      - name: test the published exe
        shell: pwsh
        run: |
          $env:REDMINE_TEST_EXE = "$PWD/out/win-x64/redmine.exe"
          dotnet test --no-build -c Release
          ./out/win-x64/redmine.exe --version
          "size: {0:N1} MB" -f ((Get-Item ./out/win-x64/redmine.exe).Length / 1MB)
      - name: redmine update (from the real Releases, into a temp folder)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'redmine-update'
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item out/win-x64/redmine.exe $dir
          $exe = Join-Path $dir 'redmine.exe'
          Set-Content "$exe.old" 'left by the last update'
          & $exe --version
          if (Test-Path "$exe.old") { throw 'redmine.exe.old was not deleted at the start' }
          & $exe update --check
          # Going back to a released version exercises the download, the hash, the check of the new exe and the swap.
          & $exe update --to 0.2.0
          if ($LASTEXITCODE -ne 0) { throw 'redmine update failed' }
          $printed = & $exe --version
          if ($printed -ne '0.2.0') { throw "after the update, redmine --version printed $printed" }
      - name: install script (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Compress-Archive -Path out/win-x64/redmine.exe -DestinationPath out/redmine-win-x64.zip -Force
          ./tests/install-check.ps1 -Zip out/redmine-win-x64.zip
      - name: install script (PowerShell 7)
        shell: pwsh
        run: ./tests/install-check.ps1 -Zip out/redmine-win-x64.zip
